site_name: modelmap
site_description: Find the language-model files on a machine, map them by size, and remove the ones you no longer need.
site_url: https://flux-frontiers.github.io/modelmap/
repo_url: https://github.com/Flux-Frontiers/modelmap
repo_name: Flux-Frontiers/modelmap
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true

nav:
  - Home: index.md
  - Guide: guide.md
  - CLI reference: cli.md
  - Cheat sheet: cheatsheet.md
  - API reference:
      - Scanning: api/scanner.md
      - Records: api/records.md
      - Removal: api/removal.md
      - The map: api/render.md
      - The server: api/serve.md
