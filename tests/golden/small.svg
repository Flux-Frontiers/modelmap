<style>
.modelmap{--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--c0:#1baf7a;--i0:#000000;--c1:#2a78d6;--i1:#000000;--c2:#eb6834;--i2:#000000;--c3:#484842;--i3:#ffffff}
